<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grist PDF Viewer Widget</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f6fb; color: #1f2937; }
      .app { padding: 0.75rem; display: grid; gap: 0.6rem; }
      .status { margin: 0; color: #374151; font-size: 0.95rem; }
      .viewer-container { border-radius: 10px; overflow: hidden; border: 1px solid #d6dbe6; background: #fff; min-height: 80vh; }
      .pdf-viewer { border: 0; width: 100%; height: 80vh; display: block; }
    </style>
  </head>
  <body>
    <main class="app">
      <p id="status" class="status">Chargement…</p>
      <section id="viewer-container" class="viewer-container" hidden>
        <iframe id="pdf-viewer" title="Visualisation PDF" class="pdf-viewer" loading="lazy"></iframe>
      </section>
    </main>

    <script>
      const DEFAULT_MAPPING = { pdfColumn: "PieceJointe" };

      const statusEl = document.getElementById("status");
      const viewerContainerEl = document.getElementById("viewer-container");
      const viewerEl = document.getElementById("pdf-viewer");

      let currentMapping = { ...DEFAULT_MAPPING };
      let latestRecord = null;

      function setStatus(message) { statusEl.textContent = message; }

      function getAttachmentId(cellValue) {
        if (typeof cellValue === "number") return cellValue;
        if (!Array.isArray(cellValue) || cellValue.length === 0) return null;

        const first = cellValue[0];
        if (typeof first === "number") return first;
        if (first && typeof first === "object" && typeof first.id === "number") return first.id;
        return null;
      }

      async function buildAttachmentUrl(attachmentId) {
        if (!attachmentId) return null;
        const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
        const baseUrl = tokenInfo.baseUrl || window.location.origin;
        const token = tokenInfo.token ? `auth=${encodeURIComponent(tokenInfo.token)}` : "";
        const query = token ? `?${token}` : "";
        return `${baseUrl}/attachments/${attachmentId}${query}`;
      }


      function getRecordCell(record, configuredColumn) {
        if (!record || !configuredColumn) return undefined;
        if (Object.prototype.hasOwnProperty.call(record, configuredColumn)) {
          return record[configuredColumn];
        }

        const expected = String(configuredColumn).toLowerCase();
        const key = Object.keys(record).find((k) => String(k).toLowerCase() === expected);
        return key ? record[key] : undefined;
      }

      async function renderRecord(record) {
        if (!record) {
          viewerContainerEl.hidden = true;
          viewerEl.removeAttribute("src");
          setStatus("Sélectionnez une ligne dans la table.");
          return;
        }

        const attachmentId = getAttachmentId(getRecordCell(record, currentMapping.pdfColumn));
        if (!attachmentId) {
          viewerContainerEl.hidden = true;
          viewerEl.removeAttribute("src");
          setStatus(`Aucun PDF trouvé dans la colonne « ${currentMapping.pdfColumn} » pour cette ligne.`);
          return;
        }

        const url = await buildAttachmentUrl(attachmentId);
        viewerEl.src = url;
        viewerContainerEl.hidden = false;
        setStatus(`PDF affiché depuis la colonne « ${currentMapping.pdfColumn} ».`);
      }

      function parseMapping(options) {
        const mapping = options?.columns || {};
        const configured = mapping.pdfColumn || DEFAULT_MAPPING.pdfColumn;
        currentMapping = { pdfColumn: String(configured).trim() };
      }

      function initStandaloneMock() {
        setStatus("Mode local: ce widget affiche un PDF de la ligne active dans Grist.");
      }

      function initGristMode() {
        grist.ready({
          columns: [{ name: "pdfColumn", title: "Colonne PDF (Attachments)", type: "Attachments" }],
          requiredAccess: "read table",
        });

        grist.onOptions((options) => {
          parseMapping(options);
          setStatus(`Colonne PDF configurée: « ${currentMapping.pdfColumn} ».`);
          if (latestRecord) {
            renderRecord(latestRecord).catch((error) => {
              console.error(error);
              setStatus("Erreur lors du chargement du PDF.");
            });
          }
        });

        grist.onRecord((record) => {
          latestRecord = record;
          renderRecord(record).catch((error) => {
            console.error(error);
            setStatus("Erreur lors du chargement du PDF.");
          });
        });
      }

      if (window.grist && window.grist.docApi) initGristMode();
      else initStandaloneMock();
    </script>
  </body>
</html>
