<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grist PDF Viewer Widget</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f6fb; color: #1f2937; }
      .app { padding: 0.75rem; display: grid; gap: 0.6rem; }
      .status { margin: 0; color: #374151; font-size: 0.95rem; }
      .viewer-container { border-radius: 10px; overflow: hidden; border: 1px solid #d6dbe6; background: #fff; min-height: 80vh; }
      .pdf-viewer { border: 0; width: 100%; height: 80vh; display: block; }
    </style>
  </head>
  <body>
    <main class="app">
      <p id="status" class="status">Chargement…</p>
      <section id="viewer-container" class="viewer-container" hidden>
        <iframe id="pdf-viewer" title="Visualisation PDF" class="pdf-viewer" loading="lazy"></iframe>
      </section>
    </main>

    <script>
      const DEFAULT_MAPPING = { pdfColumn: "PieceJointe" };

      const statusEl = document.getElementById("status");
      const viewerContainerEl = document.getElementById("viewer-container");
      const viewerEl = document.getElementById("pdf-viewer");

      let currentMapping = { ...DEFAULT_MAPPING };
      let latestRecord = null;
      let currentBlobUrl = null;

      function setStatus(message) { statusEl.textContent = message; }

      function clearViewer(message) {
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = null;
        }
        viewerEl.removeAttribute("src");
        viewerContainerEl.hidden = true;
        setStatus(message);
      }

      function getRecordCell(record, configuredColumn) {
        if (!record || !configuredColumn) return undefined;
        if (Object.prototype.hasOwnProperty.call(record, "pdfColumn")) return record.pdfColumn;
        if (Object.prototype.hasOwnProperty.call(record, configuredColumn)) return record[configuredColumn];
        const expected = String(configuredColumn).toLowerCase();
        const key = Object.keys(record).find((k) => String(k).toLowerCase() === expected);
        return key ? record[key] : undefined;
      }

      function getAttachmentId(value) {
        if (value == null) return null;
        if (typeof value === "number") return value;
        if (typeof value === "string") {
          const trimmed = value.trim();
          return /^\d+$/.test(trimmed) ? Number(trimmed) : null;
        }
        if (Array.isArray(value)) {
          for (const item of value) {
            const id = getAttachmentId(item);
            if (id) return id;
          }
          return null;
        }
        if (typeof value === "object") {
          const candidates = [value.id, value.attachmentId, value.fileId, value.rowId];
          for (const candidate of candidates) {
            const id = getAttachmentId(candidate);
            if (id) return id;
          }
        }
        return null;
      }

      async function fetchPdfBlobUrl(attachmentId) {
        const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
        const baseUrl = tokenInfo.baseUrl || window.location.origin;
        const token = tokenInfo.token ? `auth=${encodeURIComponent(tokenInfo.token)}` : "";
        const query = token ? `?${token}` : "";

        const response = await fetch(`${baseUrl}/attachments/${attachmentId}/download${query}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.arrayBuffer();
        const blob = new Blob([data], { type: "application/pdf" });
        return URL.createObjectURL(blob);
      }

      async function renderRecord(record) {
        if (!record) {
          clearViewer("Sélectionnez une ligne dans la table.");
          return;
        }

        const cellValue = getRecordCell(record, currentMapping.pdfColumn);
        const attachmentId = getAttachmentId(cellValue);
        if (!attachmentId) {
          clearViewer(`Aucun PDF trouvé (colonne: « ${currentMapping.pdfColumn} »).`);
          return;
        }

        const blobUrl = await fetchPdfBlobUrl(attachmentId);
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = blobUrl;

        viewerEl.src = blobUrl;
        viewerContainerEl.hidden = false;
        setStatus(`PDF affiché depuis la colonne « ${currentMapping.pdfColumn} ».`);
      }

      function parseMapping(options) {
        const mapping = options?.columns || {};
        const configured = mapping.pdfColumn || DEFAULT_MAPPING.pdfColumn;
        currentMapping = { pdfColumn: String(configured).trim() };
      }

      function initStandaloneMock() {
        setStatus("Mode local: connectez ce widget à Grist et configurez pdfColumn.");
      }

      function initGristMode() {
        grist.ready({
          columns: [{ name: "pdfColumn", title: "Colonne PDF (Pièce jointe)", type: "Attachments" }],
          requiredAccess: "read table",
        });

        grist.onOptions((options) => {
          parseMapping(options);
          if (latestRecord) {
            renderRecord(latestRecord).catch((error) => {
              console.error(error);
              clearViewer("Erreur lors du chargement du PDF.");
            });
          } else {
            setStatus(`Colonne PDF configurée: « ${currentMapping.pdfColumn} ».`);
          }
        });

        grist.onRecord((record) => {
          latestRecord = record;
          renderRecord(record).catch((error) => {
            console.error(error);
            clearViewer("Erreur lors du chargement du PDF.");
          });
        });
      }

      if (window.grist && window.grist.docApi) initGristMode();
      else initStandaloneMock();
    </script>
  </body>
</html>
