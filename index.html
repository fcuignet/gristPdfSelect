<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grist PDF Select Widget</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #f4f6fb;
        color: #1f2937;
      }
      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      .subtitle {
        margin: 0.2rem 0 0;
        color: #4b5563;
      }
      .field-label {
        font-weight: 600;
      }
      #record-select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 8px;
        border: 1px solid #c8cfdb;
        background: #fff;
      }
      .status {
        margin: 0;
        color: #374151;
        font-size: 0.95rem;
      }
      .viewer-container {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #d6dbe6;
        background: #fff;
        min-height: 70vh;
      }
      .pdf-viewer {
        border: 0;
        width: 100%;
        height: 70vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Pièce jointe PDF</h1>
        <p class="subtitle">Sélectionnez un enregistrement puis affichez le PDF configuré dans les options du widget.</p>
      </header>

      <label for="record-select" class="field-label">Enregistrement</label>
      <select id="record-select"></select>

      <p id="status" class="status">Chargement des données…</p>

      <section id="viewer-container" class="viewer-container" hidden>
        <iframe id="pdf-viewer" title="Visualisation PDF" class="pdf-viewer" loading="lazy"></iframe>
      </section>
    </main>

    <script>
      const DEFAULT_MAPPING = {
        menuColumn: "Categorie",
        pdfColumn: "PieceJointe",
      };

      const recordSelectEl = document.getElementById("record-select");
      const statusEl = document.getElementById("status");
      const viewerContainerEl = document.getElementById("viewer-container");
      const viewerEl = document.getElementById("pdf-viewer");

      let latestRows = [];
      let currentMapping = { ...DEFAULT_MAPPING };

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getAttachmentId(pdfCellValue) {
        if (Array.isArray(pdfCellValue)) {
          return pdfCellValue[0] ?? null;
        }
        if (typeof pdfCellValue === "number") {
          return pdfCellValue;
        }
        return null;
      }

      async function buildAttachmentUrl(attachmentId) {
        if (!attachmentId) {
          return null;
        }

        const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
        const baseUrl = tokenInfo.baseUrl || window.location.origin;
        const token = tokenInfo.token ? `auth=${encodeURIComponent(tokenInfo.token)}` : "";
        const query = token ? `?${token}` : "";

        // /attachments/{id} allows inline display in iframe for PDFs.
        return `${baseUrl}/attachments/${attachmentId}${query}`;
      }

      function getSelectedRow() {
        const selectedValue = recordSelectEl.value;
        return latestRows.find((row) => String(row[currentMapping.menuColumn] ?? "") === selectedValue);
      }

      async function showCurrentSelectionPdf() {
        const row = getSelectedRow();
        if (!row) {
          viewerContainerEl.hidden = true;
          viewerEl.removeAttribute("src");
          setStatus("Aucune ligne correspondante.");
          return;
        }

        const attachmentId = getAttachmentId(row[currentMapping.pdfColumn]);
        if (!attachmentId) {
          viewerContainerEl.hidden = true;
          viewerEl.removeAttribute("src");
          setStatus("La ligne sélectionnée ne contient pas de pièce jointe PDF dans la colonne configurée.");
          return;
        }

        const url = await buildAttachmentUrl(attachmentId);
        viewerEl.src = url;
        viewerContainerEl.hidden = false;
        setStatus(`PDF chargé pour « ${recordSelectEl.value} ».`);
      }

      function refreshRecordSelect(rows) {
        latestRows = (rows || []).filter(
          (row) => row[currentMapping.menuColumn] != null && row[currentMapping.menuColumn] !== ""
        );

        recordSelectEl.innerHTML = latestRows
          .map((row, idx) => {
            const value = String(row[currentMapping.menuColumn]);
            return `<option value="${escapeHtml(value)}" ${idx === 0 ? "selected" : ""}>${escapeHtml(value)}</option>`;
          })
          .join("");

        if (!latestRows.length) {
          viewerContainerEl.hidden = true;
          viewerEl.removeAttribute("src");
          setStatus("Aucune donnée disponible avec la colonne menu configurée.");
          return;
        }

        showCurrentSelectionPdf().catch((error) => {
          console.error(error);
          setStatus("Impossible d'afficher le PDF pour cette sélection.");
        });
      }

      function parseMapping(options) {
        const mapping = options?.columns || {};
        currentMapping = {
          menuColumn: mapping.menuColumn || DEFAULT_MAPPING.menuColumn,
          pdfColumn: mapping.pdfColumn || DEFAULT_MAPPING.pdfColumn,
        };
      }

      function initStandaloneMock() {
        const mockRows = [
          { Categorie: "Facture Janvier", PieceJointe: [11] },
          { Categorie: "Facture Février", PieceJointe: [13] },
        ];
        parseMapping({});
        refreshRecordSelect(mockRows);
        setStatus("Mode démo local: configurez menuColumn et pdfColumn dans Grist en usage réel.");
      }

      function initGristMode() {
        grist.ready({
          columns: [
            { name: "menuColumn", title: "Colonne menu (sélection)", type: "Text" },
            { name: "pdfColumn", title: "Colonne PDF (Attachments)", type: "Attachments" },
          ],
          requiredAccess: "read table",
        });

        grist.onOptions((options) => {
          parseMapping(options);
          if (latestRows.length) {
            refreshRecordSelect(latestRows);
          }
        });

        grist.onRecords((records) => {
          refreshRecordSelect(records || []);
        });
      }

      recordSelectEl.addEventListener("change", () => {
        showCurrentSelectionPdf().catch((error) => {
          console.error(error);
          setStatus("Erreur lors du chargement du PDF.");
        });
      });

      if (window.grist && window.grist.docApi) {
        initGristMode();
      } else {
        initStandaloneMock();
      }
    </script>
  </body>
</html>
